<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidStream - Galeri Video & Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header App Utama dengan Logo Dua Warna (Vid - Putih, Stream - Biru) -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur border-b border-slate-800/80 px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="goHome()">
      <div class="bg-gradient-to-tr from-indigo-600 to-blue-500 p-2 rounded-xl shadow-md shadow-indigo-500/20">
        <svg class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <span class="font-bold text-xl tracking-tight">
        <span class="text-white">Vid</span><span class="text-blue-500">Stream</span>
      </span>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        HD Stream
      </span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 pb-20">

    <!-- VIEW 1: DASHBOARD KATALOG (GRID 2x3 & PAGINASI) -->
    <section id="catalogView" class="space-y-5">
      
      <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
        <div class="flex items-center gap-2.5">
          <span class="text-xl">🎬</span>
          <h2 class="text-xl font-bold text-white tracking-wide">Galeri Video</h2>
        </div>
        <p class="text-xs sm:text-sm text-slate-400">Pilih video untuk diputar langsung.</p>
        <div>
          <span class="inline-block bg-slate-950/80 text-indigo-400 border border-slate-800 text-xs font-medium px-3 py-1 rounded-lg">
            Total: 26 Video
          </span>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          Katalog Pilihan
        </h3>
        <span id="pageIndicator" class="text-xs text-slate-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-800"></span>
      </div>

      <!-- Grid 2x3 Katalog Video -->
      <div id="videoGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4"></div>

      <!-- Controls Paginasi Angka & Navigasi Sebelumnya/Selanjutnya -->
      <div id="paginationContainer" class="flex flex-wrap justify-center items-center gap-2 pt-6"></div>
    </section>

    <!-- VIEW 2: PEMUTAR VIDEO (PLAYER EXASTREAM + IKLAN OVERLAY) -->
    <section id="playerView" class="hidden space-y-4">
      
      <div class="flex items-center justify-between">
        <button onclick="goHome()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 transition text-sm font-medium shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Kembali ke Galeri
        </button>
      </div>

      <!-- Container Pemutar Video 16:9 dengan Layer Overlay Iklan -->
      <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
        
        <iframe id="videoPlayer" class="w-full h-full border-0" allowfullscreen allow="autoplay"></iframe>

        <!-- BACKDROP TRANSPARAN (Pemicu Smartlink) -->
        <div id="adBackdrop" class="absolute inset-0 z-10 bg-transparent cursor-pointer hidden" onclick="triggerSmartlinkBackdrop()"></div>

        <!-- IKLAN 1: Chat Box Overlay -->
        <div id="chatAd" class="absolute inset-x-4 top-1/2 -translate-y-1/2 z-20 hidden justify-center pointer-events-auto">
          <a href="https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe" target="_blank" onclick="handleAdClick('chatAd', 'chat')" class="w-full max-w-xs bg-slate-900/95 border border-slate-700/90 p-3 pb-7 rounded-2xl shadow-2xl backdrop-blur flex items-start gap-2.5 relative text-left no-underline hover:border-slate-500 transition animate-fade-in">
            <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-base flex-shrink-0 shadow-md">💬</div>
            <div class="chat-text flex-1 pr-2"></div>
            <span onclick="closeAd(event, 'chatAd', 'chat')" class="absolute bottom-1.5 right-2.5 bg-red-500/90 hover:bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded cursor-pointer transition z-30">tutup</span>
          </a>
        </div>

        <!-- IKLAN 2: In-Page Push Video (Sejajar Kanan dengan Iklan 1, Posisi di Tengah Vertikal) -->
        <div id="bannerAd" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 hidden pointer-events-auto w-36 sm:w-44 bg-slate-900/95 border border-indigo-500/50 rounded-2xl overflow-hidden shadow-2xl backdrop-blur animate-fade-in animate-bounce">
          <a href="https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe" target="_blank" onclick="handleAdClick('bannerAd', 'banner')" class="block relative w-full aspect-[9/16] bg-black">
            <video id="bannerVideo" class="w-full h-full object-cover pointer-events-none" autoplay muted loop playsinline></video>
            <div class="absolute top-2 left-2 bg-black/60 backdrop-blur px-2 py-0.5 rounded-md text-[9px] font-bold text-indigo-400 border border-slate-700/50 flex items-center gap-1">
              <span>🔔</span> Video Rekomendasi
            </div>
            <span onclick="closeBannerWithSmartlink(event)" class="absolute top-2 right-2 w-5 h-5 rounded-full bg-red-500/90 hover:bg-red-600 text-white text-[10px] font-bold flex items-center justify-center cursor-pointer shadow transition z-40">×</span>
          </a>
        </div>

      </div>

      <!-- Info Judul Video & Tombol Interaksi (Like, Share, Download) -->
      <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-3">
        <h1 id="videoTitle" class="text-base sm:text-lg font-bold text-blue-400 tracking-wide"></h1>
        
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-xs">
          <button onclick="toggleLike(this)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-300 transition border border-slate-700/50">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            <span id="likeCount">1.4K</span>
          </button>

          <button onclick="shareVideo()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-300 transition border border-slate-700/50">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
            </svg>
            <span>Bagikan</span>
          </button>

          <button onclick="downloadVideo()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition shadow-md shadow-blue-600/30 font-semibold">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            <span>Unduh HD</span>
          </button>
        </div>
      </div>

      <!-- SECTION: REKOMENDASI VIDEO TERKAIT DI BAWAH PLAYER -->
      <div class="space-y-3 pt-2">
        <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500"></span>
          Video Terkait
        </h3>
        <div id="relatedVideosGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <!-- Render via JavaScript -->
        </div>
      </div>

    </section>

  </main>

  <!-- JavaScript Logika Web -->

      { id: 'v26', title: 'Cantik & mulus', embedUrl: 'https://trbnvideo.live/e/XXvnStXb', thumbUrl: 'https://i.ibb.co/LdLFpdL8/Screenshot-2026-1031-084559.png', views: '79.1K', duration: '8:14' }
    ];

    function renderCatalog() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      const totalPages = Math.ceil(videoDatabase.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedVideos = videoDatabase.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      paginatedVideos.forEach(v => {
        const card = document.createElement('div');
        card.className = "group relative bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden cursor-pointer hover:border-indigo-500/50 transition flex flex-col shadow-xl";
        card.onclick = () => selectVideo(v.id);

        card.innerHTML = `
          <div class="relative w-full aspect-video bg-slate-950 overflow-hidden">
            <img src="${v.thumbUrl}" alt="${v.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition">
              <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-600/40 group-hover:scale-110 transition">
                <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <span class="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow">${v.duration}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
            <h3 class="text-xs font-semibold text-blue-400 group-hover:text-blue-300 transition line-clamp-2 leading-snug">${v.title}</h3>
            <div class="flex items-center justify-between text-[11px] pt-1">
              <span class="text-slate-400 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                ${v.views}
              </span>
              <span class="text-blue-400 font-semibold group-hover:underline flex items-center">Tonton &gt;</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('pageIndicator').textContent = `Hal ${currentPage} dari ${totalPages}`;
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = '&larr; Sebelumnya';
      prevBtn.className = `px-3 py-1.5 rounded-lg font-bold text-xs transition border flex items-center gap-1 ${
        currentPage === 1 ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800 hover:text-white'
      }`;
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderCatalog(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = `w-8 h-8 rounded-lg font-bold text-xs transition border ${
          i === currentPage ? 'bg-blue-600 border-blue-500 text-white shadow-md' : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-white'
        }`;
        btn.onclick = () => { currentPage = i; renderCatalog(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        container.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = 'Selanjutnya &rarr;';
      nextBtn.className = `px-3 py-1.5 rounded-lg font-bold text-xs transition border flex items-center gap-1 ${
        currentPage === totalPages ? 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800 hover:text-white'
      }`;
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderCatalog(); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
      container.appendChild(nextBtn);
    }

    function renderRelatedVideos(currentVideoId) {
      const relatedGrid = document.getElementById('relatedVideosGrid');
      relatedGrid.innerHTML = '';

      // Ambil video secara acak atau selain video yang sedang diputar (maksimal 6 video)
      const filtered = videoDatabase.filter(v => v.id !== currentVideoId);
      const shuffled = filtered.sort(() => 0.5 - Math.random()).slice(0, 6);

      shuffled.forEach(v => {
        const card = document.createElement('div');
        card.className = "group relative bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden cursor-pointer hover:border-indigo-500/50 transition flex flex-col shadow-xl";
        card.onclick = () => selectVideo(v.id);

        card.innerHTML = `
          <div class="relative w-full aspect-video bg-slate-950 overflow-hidden">
            <img src="${v.thumbUrl}" alt="${v.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-600/40 group-hover:scale-110 transition">
                <svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>
            <span class="absolute bottom-1.5 right-1.5 bg-black/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow">${v.duration}</span>
          </div>
          <div class="p-2.5 flex-1 flex flex-col justify-between space-y-1">
            <h3 class="text-xs font-semibold text-blue-400 group-hover:text-blue-300 transition line-clamp-2 leading-snug">${v.title}</h3>
            <span class="text-slate-400 text-[10px] flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              ${v.views}
            </span>
          </div>
        `;
        relatedGrid.appendChild(card);
      });
    }

    function selectVideo(videoId) {
      window.open(SMARTLINK_URL, '_blank');
      const video = videoDatabase.find(v => v.id === videoId);
      if (!video) return;

      currentVideo = video;
      document.getElementById('videoTitle').textContent = video.title;
      document.getElementById('videoPlayer').src = video.embedUrl;

      document.getElementById('catalogView').classList.add('hidden');
      document.getElementById('playerView').classList.remove('hidden');

      // Scroll halus ke bagian atas halaman
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Render video terkait di bawah pemutar
      renderRelatedVideos(video.id);

      resetAndStartAdSystem();
    }

    function goHome() {
      document.getElementById('playerView').classList.add('hidden');
      document.getElementById('catalogView').classList.remove('hidden');
      document.getElementById('videoPlayer').src = '';
      clearTimeout(adTimer);
      hideAllAds();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAndStartAdSystem() {
      chatShowCount = 0;
      bannerShowCount = 0;
      hideAllAds();
      scheduleNextAdCycle();
    }

    function hideAllAds() {
      document.getElementById('chatAd').style.display = 'none';
      document.getElementById('bannerAd').style.display = 'none';
      document.getElementById('adBackdrop').classList.add('hidden');
    }

    function scheduleNextAdCycle() {
      if (chatShowCount < maxShows || bannerShowCount < maxShows) {
        clearTimeout(adTimer);
        adTimer = setTimeout(() => { showAdCycle(); }, 5000);
      }
    }

    function showAdCycle() {
      document.getElementById('adBackdrop').classList.remove('hidden');

      if (chatShowCount < maxShows) {
        const chatTextElement = document.querySelector('#chatAd .chat-text');
        if (chatShowCount === 0) {
          chatTextElement.innerHTML = `
            <strong class="text-indigo-400 font-bold block text-[11px] mb-0.5">Pesan Baru</strong>
            <p class="text-slate-200 text-[11px] leading-snug break-words">Seseorang mengirimkan foto/video khusus untukmu! Klik untuk melihat sekarang.</p>
          `;
        } else {
          chatTextElement.innerHTML = `
            <strong class="text-indigo-400 font-bold block text-[11px] mb-0.5">Pesan Baru (1)</strong>
            <p class="text-slate-200 text-[11px] leading-snug break-words">Pesan belum dibaca: Link akses video penuh hampir kadaluarsa! Klik di sini.</p>
          `;
        }
        document.getElementById('chatAd').style.display = 'flex';
      }

      setTimeout(() => {
        if (bannerShowCount < maxShows) {
          const bannerVideoElement = document.getElementById('bannerVideo');
          bannerVideoElement.src = bannerShowCount === 0 ? 'https://cdn.videy.co/ZQdLatS51.mp4' : 'https://cdn.videy.co/ENOlSaoU1.mp4';
          bannerVideoElement.play();
          document.getElementById('bannerAd').style.display = 'block';
        }
      }, 500);
    }

    function handleAdClick(adId, adType) {
      if (adType === 'chat') chatShowCount++;
      if (adType === 'banner') bannerShowCount++;
      document.getElementById(adId).style.display = 'none';
      checkAllAdsClosed();
    }

    function closeAd(event, adId, adType) {
      event.preventDefault();
      event.stopPropagation();
      if (adType === 'chat') chatShowCount++;
      if (adType === 'banner') bannerShowCount++;
      document.getElementById(adId).style.display = 'none';
      checkAllAdsClosed();
    }

    function closeBannerWithSmartlink(event) {
      event.preventDefault();
      event.stopPropagation();
      window.open(SMARTLINK_URL, '_blank');
      bannerShowCount++;
      document.getElementById('bannerAd').style.display = 'none';
      checkAllAdsClosed();
    }

    function triggerSmartlinkBackdrop() {
      window.open(SMARTLINK_URL, '_blank');
      hideAllAds();
      chatShowCount++;
      bannerShowCount++;
      checkAllAdsClosed();
    }

    function checkAllAdsClosed() {
      if (document.getElementById('chatAd').style.display === 'none' && document.getElementById('bannerAd').style.display === 'none') {
        document.getElementById('adBackdrop').classList.add('hidden');
        if (chatShowCount < maxShows || bannerShowCount < maxShows) {
          scheduleNextAdCycle();
        }
      }
    }

    let isLiked = false;
    function toggleLike(btn) {
      isLiked = !isLiked;
      const svgIcon = btn.querySelector('svg');
      const countSpan = document.getElementById('likeCount');
      if (isLiked) {
        svgIcon.setAttribute('fill', 'currentColor');
        btn.classList.add('text-red-400', 'border-red-500/40');
        countSpan.textContent = '1.5K';
      } else {
        svgIcon.setAttribute('fill', 'none');
        btn.classList.remove('text-red-400', 'border-red-500/40');
        countSpan.textContent = '1.4K';
      }
    }

    function shareVideo() {
      if (navigator.share) {
        navigator.share({ title: document.getElementById('videoTitle').textContent, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Tautan video berhasil disalin!');
      }
    }

    function downloadVideo() {
      window.open(SMARTLINK_URL, '_blank');
    }

    renderCatalog();
  </script>
</body>
</html>
