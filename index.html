<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Video</title>

    <!-- KODE POPUNDER ADSTERRA -->
    <script src="https://thewilddetail.com/58/5d/14/585d14a1088579ccf27a4840dfa44967.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        h1 {
            margin-bottom: 24px;
            font-size: 1.8rem;
            text-align: center;
            color: #38bdf8;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(56, 189, 248, 0.2);
        }
        .card-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .card:hover .play-button {
            background-color: #0284c7;
        }
        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffffff;
            margin-left: 4px;
        }
        .card-title {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            border-top: 1px solid #334155;
        }

        /* ===== PENGATURAN LAYAR PENUH (FULL SCREEN) UNTUK GAMBAR AWALAN ===== */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 0;
        }
        
        #splash-screen .splash-card {
            width: 100%;
            height: 100%;
            max-width: none;
            border-radius: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-decoration: none;
        }

        #splash-screen .splash-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Menyesuaikan gambar agar menutupi layar penuh tanpa gepeng */
            display: block;
        }

        #main-content {
            display: none; /* Disembunyikan dulu sebelum diklik */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ================= TAMPILAN PERTAMA (FULL SCREEN SPLASH) ================= -->
    <div id="splash-screen">
        <a class="splash-card" href="#" onclick="showVideoSelection(event)">
            <img class="splash-img" src="https://i.ibb.co.com/nqR0QxRf/image-f1eedfe6.jpg" alt="Mulai Video">
            <div class="play-button" style="width: 80px; height: 80px;">
                <div class="play-icon" style="border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 26px solid #ffffff;"></div>
            </div>
        </a>
    </div>

    <!-- ================= TAMPILAN PILIHAN FOLDER VIDEO (SETELAH DIKLIK) ================= -->
    <div id="main-content">
        <h1>VIDEO HIJABKU</h1>

        <div class="container">
            <!-- VIDEO 1 (Hijab Season 1) -->
            <a class="card" 
               href="https://thewilddetail.com/jcmqzgpi?key=24b55e3636d607271fdc76c2cd116ebe" 
               target="_blank" 
               onclick="openFolder(event, 'https://trbnvideo.live/f/1teiHsVA')">
                <div class="card-img-wrapper">
                    <img class="card-img" src="https://i.ibb.co.com/LzZYGByp/Hijab-Season-1-Tiga-Kisah-Wanita.png" alt="Hijab Season 1">
                    <div class="play-button">
                        <div class="play-icon"></div>
                    </div>
                </div>
                <div class="card-title">Hijab Season 1</div>
            </a>

            <!-- VIDEO 2 (Hijab Season 2 / Video 2) -->
            <a class="card" 
               href="https://thewilddetail.com/jcmqzgpi?key=24b55e3636d607271fdc76c2cd116ebe" 
               target="_blank" 
               onclick="openFolder(event, 'https://trbnvideo.live/f/q6ydNuKs')">
                <div class="card-img-wrapper">
                    <img class="card-img" src="https://i.ibb.co.com/qfw0HQS/image-1a6565b4.jpg" alt="Hijab Season 2">
                    <div class="play-button">
                        <div class="play-icon"></div>
                    </div>
                </div>
                <div class="card-title">Hijab Season 2</div>
            </a>
        </div>
    </div>

    <!-- SCRIPT NAVIGASI & POPUNDER -->
    <script>
        function showVideoSelection(event) {
            event.preventDefault(); // Mencegah link default
            
            // Sembunyikan layar penuh pertama, lalu tampilkan pilihan folder video
            document.getElementById('splash-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
        }

        function openFolder(event, destinationUrl) {
            setTimeout(function() {
                window.location.href = destinationUrl;
            }, 300);
        }
    </script>

</body>
</html>
